name: Release

# Cut a release by pushing a tag:
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag must match the version in pyproject.toml. That is checked before
# anything is published, because a Release whose artifacts disagree with their
# own metadata is worse than no Release.
#
# One build feeds both destinations: the same sdist and wheel are attached to
# the GitHub Release and uploaded to PyPI, so the two can never disagree.
#
# Publishing uses PyPI Trusted Publishing (OIDC) — there is no API token in
# this repository. PyPI must be told to trust this workflow first; the
# one-time setup is in RELEASING.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build a release from (e.g. v0.2.0)"
        required: true
      testpypi:
        description: "Publish to TestPyPI instead of PyPI (skips the GitHub Release)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: check
        name: Tag must match pyproject version
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          version="$(python -c "
          import tomllib, pathlib
          print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          echo "tag=$tag  pyproject=$version"
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match pyproject version $version (expected v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Never release a red build
        run: |
          ruff check .
          pytest --rootdir="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/tests"
        working-directory: ${{ runner.temp }}

  build:
    needs: [verify, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - name: Build
        run: python -m build
      - name: Validate metadata
        run: twine check --strict dist/*
      - name: Smoke test the wheel in a clean venv
        run: |
          set -euo pipefail
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/python -c "import microk8s_mcp.server as s; print('import ok:', s.__name__)"
          test -x /tmp/smoke/bin/microk8s-mcp
          echo "entry point ok"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: [verify, build]
    runs-on: ubuntu-latest
    # The environment gates the OIDC claim PyPI checks, and gives you a place
    # to add a required reviewer if you ever want releases to need a human.
    environment:
      name: ${{ inputs.testpypi && 'testpypi' || 'pypi' }}
      url: ${{ inputs.testpypi && 'https://test.pypi.org/p/microk8s-mcp' || 'https://pypi.org/p/microk8s-mcp' }}
    permissions:
      id-token: write # mint the OIDC token Trusted Publishing verifies
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          repository-url: ${{ inputs.testpypi && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          print-hash: true

  release:
    needs: [verify, build, pypi]
    # A TestPyPI dry run should not mint a GitHub Release.
    if: ${{ !inputs.testpypi }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the Release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0 # full history so the changelog can look back
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Generate release notes from commits
        id: notes
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          previous="$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)"
          {
            echo "## microk8s-mcp ${tag}"
            echo
            if [ -n "$previous" ]; then
              echo "Changes since ${previous}:"
              echo
              git log --no-merges --pretty='- %s' "${previous}..${tag}"
            else
              echo "First tagged release."
            fi
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo "pip install microk8s-mcp==${{ needs.verify.outputs.version }}"
            echo '```'
            echo
            echo "The wheel ships the server itself. Cluster setup (\`rbac.yaml\`,"
            echo "\`make-kubeconfig.sh\`, the make targets) lives in the repository —"
            echo "see https://pierrejochem.github.io/microk8s-mcp/install.html"
            echo
            echo "> [!WARNING]"
            echo "> \`rbac.yaml\` grants cluster-wide write. See the README before applying it."
          } > notes.md
          cat notes.md
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag || github.ref_name }}" \
            --title "microk8s-mcp ${{ inputs.tag || github.ref_name }}" \
            --notes-file notes.md \
            dist/*
