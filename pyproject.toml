[project]
name = "microk8s-mcp"
version = "0.1.2"
description = "MCP server for managing a MicroK8s cluster from the Claude CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["mcp>=1.9"]
keywords = ["mcp", "model-context-protocol", "microk8s", "kubernetes", "claude", "kubectl", "devops"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  # Kept in step with the CI test matrix; PyPI and the pyversions badge read these.
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://pierrejochem.github.io/microk8s-mcp/"
Documentation = "https://pierrejochem.github.io/microk8s-mcp/"
Source = "https://github.com/pierrejochem/microk8s-mcp"
Issues = "https://github.com/pierrejochem/microk8s-mcp/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
microk8s-mcp = "microk8s_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["microk8s_mcp"]

# Curated rather than "everything not gitignored": the default sweep pulled in
# the documentation site, the CI config and local editor settings. The sdist
# carries the source, the tests, and the operator tooling needed to set a
# cluster up — nothing else.
[tool.hatch.build.targets.sdist]
include = [
  "/microk8s_mcp",
  "/tests",
  "/Makefile",
  "/make-kubeconfig.sh",
  "/rbac.yaml",
  "/install.txt",
  "/RELEASING.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
ignore = [
  "S603",  # subprocess call without shell=True is the point of this codebase
  "S607",  # `kubectl`/`ssh` are resolved via PATH deliberately; see MICROK8S_MCP_KUBECTL
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "S101",  # asserts are what tests are made of
  "S108",  # /tmp paths here are inert string literals, never opened
]
